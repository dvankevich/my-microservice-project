controller:
  serviceType: ClusterIP
  servicePort: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - github

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tls:
      - secretName: "jenkins-tls"
        hosts:
          - "jenkins.dvankevich.pp.ua"

persistence:
  enabled: true
  accessMode: "ReadWriteOnce"
  size: "10Gi"
