{{- range .Values.imageUpdaters }}
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  namespace: {{ .targetNamespace | default $.Release.Namespace }}
  {{- with .commonUpdateSettings }}
  commonUpdateSettings:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .writeBackConfig }}
  writeBackConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  applicationRefs:
    {{- toYaml .applicationRefs | nindent 4 }}
{{- end }}
