controller:
  serviceType: ClusterIP
  servicePort: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  serviceAccount:
    name: "jenkins-sa"
    create: false

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - github
    - job-dsl

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tls:
      - secretName: "jenkins-tls"
        hosts:
          - "jenkins.dvankevich.pp.ua"

  JCasC:
    configScripts:
      security-settings: |
        security:
          globalJobDslSecurityConfiguration:
            useScriptSecurity: false

      global-env: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: "ECR_REPO_URL"
                    value: "${ecr_repository_url}"

      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate CI pipeline for Django/Wagtail project')
                scm {
                  git {
                    remote {
                      url('https://github.com/dvankevich/my-microservice-project.git')
                      credentials('github-token')
                    }
                    branches('*/main')
                  }
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("django-wagtail-ci") {
                        description("Build and push Django/Wagtail Docker image from main")
                        environmentVariables {
                          env("TRACKED_BRANCH", "main")
                          env("IMAGE_TAG_PREFIX", "")
                        }
                        triggers {
                          githubPush()
                        }
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("https://github.com/dvankevich/my-microservice-project.git")
                                  credentials("github-token")
                                }
                                branches("*/main")
                              }
                            }
                            scriptPath("Django/Jenkinsfile")
                            lightweight(true)
                          }
                        }
                      }
                      pipelineJob("django-wagtail-ci-dev") {
                        description("Build and push Django/Wagtail Docker image from dev")
                        environmentVariables {
                          env("TRACKED_BRANCH", "dev")
                          env("IMAGE_TAG_PREFIX", "dev")
                        }
                        triggers {
                          githubPush()
                        }
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("https://github.com/dvankevich/my-microservice-project.git")
                                  credentials("github-token")
                                }
                                branches("*/dev")
                              }
                            }
                            scriptPath("Django/Jenkinsfile")
                            lightweight(true)
                          }
                        }
                      }
                      pipelineJob("django-wagtail-ci-staging") {
                        description("Build and push Django/Wagtail Docker image from staging")
                        environmentVariables {
                          env("TRACKED_BRANCH", "staging")
                          env("IMAGE_TAG_PREFIX", "staging")
                        }
                        triggers {
                          githubPush()
                        }
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("https://github.com/dvankevich/my-microservice-project.git")
                                  credentials("github-token")
                                }
                                branches("*/staging")
                              }
                            }
                            scriptPath("Django/Jenkinsfile")
                            lightweight(true)
                          }
                        }
                      }
                    ''')
                  }
                }
              }

persistence:
  enabled: true
  accessMode: "ReadWriteOnce"
  size: "10Gi"
